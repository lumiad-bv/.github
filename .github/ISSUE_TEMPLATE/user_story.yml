
name: "🎯 User Story"
description: "User Story voor software development"
title: "[US]: "
type: "User Story"

body:
  - type: markdown
    attributes:
      value: |
        ### Richtlijn
        - Houd de titel kort en actiegericht.
        - Beschrijf de *waarde* van de story, niet de oplossing.
        - Acceptance Criteria bepalen wanneer deze story **Done** is.

  - type: markdown
    attributes:
      value: |
        ---

  - type: textarea
    id: description
    attributes:
      label: "• User Story"
      description: Beschrijf de user story in het verplichte *Als / wil ik / zodat*-format.
      placeholder: |
        Als [type gebruiker / rol]
        wil ik [functionaliteit of gedrag]
        zodat [waarde / doel].
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

  - type: textarea
    id: designs-context
    attributes:
      label: "• Designs & Context (voorstel)"
      description: Denk na over UI-designs, technische context, afhankelijkheden. Stel jezelf de vraag, Hoe zou ik dit aanpakken? Beschrijf op globaal niveau welke stappen er genomen moeten worden.
      placeholder: |
        - Design / mockup (C4, flowchart, sequence diagram, etc.):
        - Technische context / aannames:
        - Afhankelijkheden:
        - Links (ADR, documentatie, andere issues):
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "• Acceptance Criteria"
      description: |
        Concreet, toetsbaar en uitbreidbaar.
        Elke regel is een checklist-item.
        Gebruik bij voorkeur Given / When / Then.
      placeholder: |
        - [ ] Gegeven de situatie …
              Wanneer de actie wordt uitgevoerd …
              Dan is het resultaat …

        - [ ] Gegeven de situatie …
              Wanneer de actie wordt uitgevoerd …
              Dan is het resultaat …

    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

  - type: markdown
    attributes:
      value: |
        ### Risk & Impact
        Drie keuzes. Twijfel je, kies dan de zwaardere. Staat een keuze nog op *Nog niet beoordeeld*, dan is het issue niet ready voor de sprint.

  - type: dropdown
    id: security-impact
    attributes:
      label: "• Security-impact"
      options:
        - "Nog niet beoordeeld"
        - "Geen — raakt geen beveiligingsrelevante onderdelen"
        - "Beperkt — raakt invoer van buiten, logging of foutafhandeling"
        - "Hoog — raakt authenticatie, autorisatie, sleutels of certificaten, of een externe interface"
    validations:
      required: true

  - type: dropdown
    id: data-impact
    attributes:
      label: "• Persoonsgegevens"
      description: "Bij Ja wordt bij refinement gekeken of de privacytoets van het product dit dekt."
      options:
        - "Nog niet beoordeeld"
        - "Nee — verwerkt, bewaart of verstuurt geen persoonsgegevens"
        - "Ja — verwerkt, bewaart of verstuurt persoonsgegevens"
    validations:
      required: true

  - type: dropdown
    id: change-scope
    attributes:
      label: "• Omvang van de wijziging"
      options:
        - "Nog niet beoordeeld"
        - "Lokaal — binnen één component"
        - "Meerdere componenten — interfaces blijven gelijk"
        - "Architectuur, interface, nieuwe library of platform — ADR nodig"
    validations:
      required: true
